name: Essai lecture (temporaire)
on:
  push:
    branches: [resumes-payants]
    paths: [".github/workflows/essai-lecture.yml"]
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tester des flux directs
        run: |
          python - <<'PY'
          import json, feedparser, requests
          from veille import collect
          out = {"robots": {}, "flux": {}}
          for u in ["https://news.google.com/rss/search?q=x", "https://news.google.com/rss/articles/abc"]:
              out["robots"][u] = collect.allowed_by_robots(u)
          sites = ["https://www.83-629.fr", "https://www.protectionsecurite-magazine.fr", "https://operationnels.com",
                   "https://www.entoutesecurite.com", "https://www.detections.fr", "https://www.infoprotection.fr",
                   "https://kohenavocats.fr", "https://www.gpmse.com", "https://www.cnaps.interieur.gouv.fr",
                   "https://www.securite-privee.org", "https://www.usp-securite.fr", "https://www.aefinfo.fr",
                   "https://www.ges-securite-privee.org", "https://www.cnpp.com", "https://www.lemondedelasecurite.fr",
                   "https://www.expoprotection.com", "https://www.solutions-numeriques.com", "https://www.alarme-securite.info"]
          for site in sites:
              for path in ["/feed/", "/rss", "/rss.xml", "/feed.xml", "/actualites/feed/"]:
                  url = site + path
                  try:
                      r = requests.get(url, headers={"User-Agent": collect.USER_AGENT}, timeout=15)
                      f = feedparser.parse(r.content)
                  except Exception as e:
                      continue
                  if f.entries:
                      e = f.entries[0]
                      desc = collect.clean_text(e.get("summary", ""), 3000)
                      out["flux"][site] = {"url": url, "robots": collect.allowed_by_robots(url), "n": len(f.entries),
                                           "titre": e.get("title", "")[:80], "resume": len(desc),
                                           "contenu": len(collect.clean_text((e.get("content") or [{}])[0].get("value", ""), 5000))}
                      break
              else:
                  out["flux"][site] = None
          json.dump(out, open("essai-lecture.json", "w"), ensure_ascii=False, indent=1)
          PY
      - name: Enregistrer le résultat
        run: |
          git config user.name "veille-tls[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add essai-lecture.json && git commit -m "Résultat de l'essai des flux" && git push
