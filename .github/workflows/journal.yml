name: Journal quotidien

on:
  schedule:
    # 4 h 30 UTC = 6 h 30 à Paris en été, 5 h 30 en hiver (GitHub peut décaler de quelques minutes).
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      site_seulement:
        description: "Régénérer seulement le site, sans nouvelle collecte"
        type: boolean
        default: false
      reanalyser:
        description: "Relire et réanalyser les articles des 3 derniers jours"
        type: boolean
        default: false
      lettre:
        description: "Envoyer la lettre de la semaine maintenant (pour essayer)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: journal
  cancel-in-progress: false

jobs:
  journal:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecter, analyser et générer le site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LETTRE_TO: ${{ secrets.LETTRE_TO }}
        run: |
          OPTIONS=""
          if [ "${{ inputs.reanalyser }}" = "true" ]; then OPTIONS="--reanalyser 3"; fi
          if [ "${{ inputs.lettre }}" = "true" ]; then OPTIONS="$OPTIONS --lettre"; fi
          if [ "${{ inputs.site_seulement }}" = "true" ]; then
            python -m veille.main --site $OPTIONS
          else
            python -m veille.main $OPTIONS
          fi

      - name: Enregistrer les articles dans le dépôt
        run: |
          git config user.name "veille-tls[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle."
          else
            git commit -m "Édition du $(TZ=Europe/Paris date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
