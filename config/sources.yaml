# Sources collectées chaque jour.
#
# google_news : une recherche Google News par ligne (syntaxe Google : guillemets,
#   OR, signe moins pour exclure). "when:2d" limite aux deux derniers jours.
# rss : flux RSS ou Atom directs. "filtre: mots_cles" ne garde que les articles
#   contenant au moins un mot-clé du profil (utile pour les flux généralistes).
# pages : pages sans flux RSS. Le programme signale les nouveaux liens apparus.
#
# Le programme respecte le fichier robots.txt de chaque site : une source qui
# interdit les robots est ignorée et signalée dans le rapport du passage.

google_news:
  - '"télésurveillance" when:2d'
  - '"centre de télésurveillance" OR "téléopérateur" OR "levée de doute" when:2d'
  - '"CNAPS" sécurité when:2d'
  - '"sécurité privée" (décret OR arrêté OR loi OR réglementation OR réforme) when:2d'
  - '"agents de sécurité" (salaires OR convention OR grève OR accord OR formation) when:2d'
  - '"prévention et sécurité" ("convention collective" OR branche OR avenant) when:7d'
  - '(APSAD OR CNPP) (certification OR référentiel OR règle OR norme) when:7d'
  - '"vidéoprotection" OR "vidéosurveillance algorithmique" when:2d'
  - '("PTI" OR "DATI") "travailleur isolé" when:7d'
  - '"sécurité électronique" (marché OR rachat OR acquisition OR lancement) when:7d'
  - '(Verisure OR Securitas OR Seris OR Prosegur OR Nexecur OR "EPS télésurveillance" OR Scutum) when:2d'
  - '"intelligence artificielle" (vidéosurveillance OR "analyse vidéo" OR alarmes) when:2d'
  - '"sécurité privée" (recrutement OR pénurie OR formation OR attractivité) when:7d'
  - '"GPMSE" OR "GES sécurité" OR "USP sécurité privée" when:7d'

rss:
  - nom: "CNIL"
    url: "https://www.cnil.fr/fr/rss.xml"
    filtre: mots_cles
  - nom: "GPMSE"
    url: "https://www.gpmse.com/feed/"
    filtre: aucun
  - nom: "83-629.fr"
    url: "https://www.83-629.fr/rss"
    filtre: aucun
  - nom: "GES sécurité privée"
    url: "https://www.ges-securite-privee.org/feed/"
    filtre: aucun
  - nom: "Kohen Avocats"
    url: "https://kohenavocats.fr/feed/"
    filtre: mots_cles
  - nom: "Opérationnels SLDS"
    url: "https://operationnels.com/feed/"
    filtre: mots_cles

pages:
  - nom: "CNPP — Ressources et actualités"
    url: "https://www.cnpp.com/blog"
    lien_contient: "/blog/"
  - nom: "CNPP — Certification APSAD"
    url: "https://www.cnpp.com/tester-certifier/certifier-prestations-services-apsad"
    lien_contient: ""
  - nom: "Scutum — Actualité et presse"
    url: "https://www.scutum-group.com/fr/actualite-et-presse"
    lien_contient: "/fr/publications/"

# Revue de presse internationale : articles étrangers, résumés et notés en français par l'IA,
# publiés dans le canal « International ». L'édition Google News s'écrit « PAYS:langue ».
# Le nombre d'articles envoyés à l'IA est plafonné par max_articles_international (config/site.yaml).
international:
  google_news:
    - requete: '"alarm monitoring" OR "monitoring center" OR "monitoring centre" OR "alarm receiving centre" when:3d'
      edition: "US:en"
    - requete: '"remote video monitoring" OR "video verification" OR "remote guarding" when:3d'
      edition: "US:en"
    - requete: '"alarm receiving centre" OR "remote monitoring" (security OR alarm) when:3d'
      edition: "GB:en"
    - requete: '"private security" (regulation OR licensing OR law OR "minimum wage") when:3d'
      edition: "GB:en"
    - requete: '(Securitas OR Verisure OR Prosegur OR "Allied Universal" OR ADT OR G4S OR "Brinks Home") (acquisition OR acquires OR results OR launches OR monitoring) when:3d'
      edition: "US:en"
    - requete: '"video analytics" OR "AI video surveillance" (alarm OR monitoring) when:3d'
      edition: "US:en"
    - requete: '(Euralarm OR CoESS OR "EN 50518" OR "The Monitoring Association") when:14d'
      edition: "GB:en"
    - requete: '"télésurveillance" OR "sécurité privée" OR "centrale d''alarme" when:3d'
      edition: "BE:fr"
    - requete: '"télésurveillance" OR "sécurité privée" OR "centrale d''alarme" when:3d'
      edition: "CH:fr"
    - requete: '"télésurveillance" OR "sécurité privée" OR "agence de sécurité" when:3d'
      edition: "CA:fr"
  rss:
    - nom: "Security Magazine"
      url: "https://www.securitymagazine.com/rss/15"
      filtre: mots_cles
    - nom: "SDM Magazine"
      url: "https://www.sdmmag.com/rss/15"
      filtre: mots_cles
    - nom: "SDM Magazine — Monitoring"
      url: "https://www.sdmmag.com/rss/topic/2654-monitoring"
      filtre: aucun

# Médias dont les articles sont réservés aux abonnés (nom exact de la source, tel qu'affiché
# sur le journal). Pour les autres sites, le programme le détecte en lisant la page quand il le peut.
sources_payantes:
  - "AEF info"
  - "Les Echos"
  - "L'Opinion"
  - "Mediapart"
  - "Contexte"
  - "Le Moniteur"
  - "Liaisons sociales"
  - "Actuel RH"
