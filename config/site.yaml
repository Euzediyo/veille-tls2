# Réglages du site public.
titre: "Veille TLS"
sous_titre: "Le journal quotidien de la télésurveillance et de la sécurité privée"
# Adresse publique du site (sert au flux RSS).
url: "https://euzediyo.github.io/veille-tls2/"

# Mentions légales (obligatoires pour un site public en France).
editeur: "Veille TLS"
contact: "veilletls@gmail.com"
hebergeur: "GitHub Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis"

# Modèle d'IA utilisé pour l'analyse.
modele: "claude-haiku-5-5"
# Nombre maximum d'articles envoyés à l'IA par passage (plafond de dépense).
max_articles_ia: 120

# Voix des deux animateurs du flash audio (autres voix possibles : fr-FR-DeniseNeural, fr-FR-HenriNeural).
podcast_voix:
  CLAIRE: "fr-FR-VivienneMultilingualNeural"
  THOMAS: "fr-FR-RemyMultilingualNeural"

# E-mail du matin, envoyé à l'adresse du secret MAIL_TO : articles du jour dont le score atteint ce seuil.
email_quotidien: true
seuil_email: 70

# Lettre de la semaine, envoyée à MAIL_TO et aux adresses du secret LETTRE_TO (séparées par des virgules).
lettre_jour: lundi        # lundi, mardi... dimanche
lettre_articles: 10       # nombre maximum d'articles
lettre_seuil: 50          # score minimum
